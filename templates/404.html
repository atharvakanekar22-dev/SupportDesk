{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found — SupportDesk</title>
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<div class="error-page">
    <div class="error-card">
        <span class="error-code-badge">HTTP 404</span>
        <h1>Page Not Found</h1>
        <p>The page or ticket you are looking for does not exist, has been archived, or was moved to another location.</p>
        <div class="error-card__actions">
            {% if user.is_authenticated %}
                <a href="{% url 'core:dashboard' %}" class="btn btn--primary">Return to Dashboard</a>
                <a href="{% url 'tickets:ticket_list' %}" class="btn btn--secondary">Ticket List</a>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="btn btn--primary">Sign In</a>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
